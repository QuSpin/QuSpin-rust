name: Lean

# The Lean development proves the mathematics behind the symmetry-sector
# formulas (see lean/README.md). It is independent of the Rust build, so it
# runs only when it changes — a full Mathlib build is expensive even with the
# prebuilt cache.
on:
  push:
    branches: [main]
    paths:
      - 'lean/**'
      - '.github/workflows/lean.yaml'
  pull_request:
    branches: [main]
    paths:
      - 'lean/**'
      - '.github/workflows/lean.yaml'
  workflow_dispatch:

jobs:
  build:
    name: Build proofs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build
        uses: leanprover/lean-action@v1
        with:
          lake-package-directory: lean
          build-args: QuSpinSymmetry
          # Fetches the prebuilt Mathlib oleans rather than compiling Mathlib.
          use-mathlib-cache: true

      # `lake build` succeeds on a file full of `sorry`, so check separately
      # that nothing is admitted. Any use would make a theorem depend on
      # `sorryAx`, which is what this grep looks for.
      - name: Reject sorry
        working-directory: lean
        run: |
          if grep -rn --include='*.lean' '\bsorry\b' QuSpinSymmetry QuSpinSymmetry.lean; then
            echo "::error::found 'sorry' in the Lean development"
            exit 1
          fi
          echo "no sorry found"

      - name: Check axiom dependencies
        working-directory: lean
        run: |
          cat > axcheck.lean <<'EOF'
          import QuSpinSymmetry
          #print axioms QuSpinSymmetry.U.mul
          #print axioms QuSpinSymmetry.inner_U_U
          #print axioms QuSpinSymmetry.P.idem
          #print axioms QuSpinSymmetry.P.selfAdjoint
          #print axioms QuSpinSymmetry.orbit_norm_eq_zero_or_card
          EOF
          out=$(env LEAN_PATH="$(lake env printenv LEAN_PATH)" lean axcheck.lean)
          rm -f axcheck.lean
          echo "$out"
          if echo "$out" | grep -q 'sorryAx'; then
            echo "::error::a theorem depends on sorryAx"
            exit 1
          fi
